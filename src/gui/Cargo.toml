cargo-features = ["edition2024"]

[package]
name = "robocraft_gui"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version = "1.85"

[lib]
name = "robocraft_gui"
path = "src/lib.rs"

[dependencies]
# egui framework - latest versions
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui = "0.32"
egui_dock = { version = "0.17", features = ["serde"] }
egui-snarl = "0.8"

# Utilities
serde = { version = "1.0", features = ["derive"] }

[features]
default = ["persistence"]
persistence = []

[[example]]
name = "custom_graph"
path = "examples/custom_graph.rs"

[profile.release]
lto = "thin"
strip = true
